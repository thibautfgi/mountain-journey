# Pipeline de déploiement vers la branche recette
# Se déclenche uniquement sur la branche develop après que tous les tests passent
name: Deploy to Recette

on:
  push:
    branches:
      - develop

jobs:
  # ─────────────────────────────────────────────
  # 1. Tests mj-auth (Spring Boot / Maven)
  # ─────────────────────────────────────────────
  test-auth:
    name: 🧪 Tests mj-auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mj-auth
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests mj-auth
        run: mvn -B verify --file pom.xml

  # ─────────────────────────────────────────────
  # 2. Tests mj-moteur (Spring Boot / Maven)
  # ─────────────────────────────────────────────
  test-moteur:
    name: 🧪 Tests mj-moteur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mj-moteur
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests mj-moteur
        run: mvn -B verify --file pom.xml

  # ─────────────────────────────────────────────
  # 3. Build & lint mj-front (Angular / Node.js)
  # ─────────────────────────────────────────────
  test-front:
    name: 🧪 Build & lint mj-front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mj-front
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: mj-front/package-lock.json

      - run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Build
        run: npm run build --if-present

  # ─────────────────────────────────────────────
  # 4. Merge develop → recette (si tout est vert)
  # ─────────────────────────────────────────────
  deploy-to-recette:
    name: 🚀 Merge develop → recette
    runs-on: ubuntu-latest
    needs:
      - test-auth
      - test-moteur
      - test-front

    steps:
      - name: Checkout du dépôt complet
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0          # historique complet nécessaire pour le merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop → recette
        run: |
          git fetch origin
          git checkout recette
          git merge --no-ff origin/develop -m "chore: merge develop → recette [auto]"
          git push origin recette

